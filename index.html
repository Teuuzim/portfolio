      rel="stylesheet"

    <title>Matheus Vaz | Full-Stack Developer & AI Automation Specialist</title>
    <script>
      // Dark + pt-BR are the document defaults, so this only undoes them for a
      // returning visitor who picked otherwise — before first paint, no flash.
      try {
        if (localStorage.getItem('portfolio-theme') === 'light') {
          document.documentElement.classList.remove('dark')
        }
        if (localStorage.getItem('portfolio-language') === 'en') {
          document.documentElement.lang = 'en'
        }
      } catch {
        /* storage blocked — defaults stand */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
